[project]
name = "open-d4rt"
version = "0.1.0"
description = "Unofficial PyTorch/GPU implementation of D4RT for 4D reconstruction and tracking."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "numpy==2.2.5",
    "PyYAML==6.0.3",
    "opencv-python-headless==4.13.0.92",
    "imageio==2.37.3",
    "pillow==12.1.1",
    "matplotlib==3.10.8",
    "tqdm==4.67.3",
    "tensorboard==2.20.0",
    "lz4==4.4.5",
]

[project.optional-dependencies]
checkpoint = [
    "huggingface-hub>=0.32.0",
]
vis = [
    "viser>=1.0.0",
]
test = [
    "pytest>=8.0.0",
]
dev = [
    "ruff>=0.15.16",
    "ty>=0.0.48",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
